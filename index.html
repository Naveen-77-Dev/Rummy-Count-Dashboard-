<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rummy Score Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    min-height: 100vh;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 10px 0 25px;
    font-size: 32px;
}

.panel {
    background: rgba(255,255,255,0.10);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

/* SETUP */

.setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    min-height: 45px;
}

button:active {
    transform: scale(0.97);
}

.add-btn {
    background: #00c853;
    color: white;
}

.start-btn {
    background: #1976d2;
    color: white;
}

.submit-btn {
    background: #00c853;
    color: white;
    width: 100%;
    margin-top: 15px;
    font-size: 17px;
}

.undo-btn {
    background: #ff9800;
    color: white;
}

.new-btn {
    background: #e53935;
    color: white;
}

/* INFO */

.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.info-box {
    background: rgba(255,255,255,0.12);
    padding: 15px;
    text-align: center;
    border-radius: 12px;
}

.info-box small {
    display: block;
    opacity: 0.8;
}

.info-box strong {
    display: block;
    font-size: 28px;
    margin-top: 5px;
}

/* PLAYERS */

.players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.player-card {
    background: white;
    color: #222;
    border-radius: 14px;
    padding: 18px;
}

.player-card.out {
    background: #dddddd;
    opacity: 0.65;
}

.player-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.player-name {
    font-size: 20px;
    font-weight: bold;
    word-break: break-word;
}

.edit-name {
    background: #ff9800;
    color: white;
    padding: 7px 10px;
    min-height: auto;
}

.total-score {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: #1565c0;
    margin: 15px 0;
}

.player-status {
    text-align: center;
    font-weight: bold;
}

.playing {
    color: #00a152;
}

.out {
    color: #d32f2f;
}

/* SCORE ENTRY */

.score-section {
    display: none;
}

.round-title {
    font-size: 25px;
    margin-bottom: 5px;
}

.round-subtitle {
    opacity: 0.8;
    margin-bottom: 15px;
}

.score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.score-box {
    background: rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 13px;
}

.score-box label {
    margin-bottom: 8px;
}

.score-box input {
    background: white;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 10px;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 600px;
    color: #222;
}

th,
td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

th {
    background: #263238;
    color: white;
}

td.player-column {
    text-align: left;
    font-weight: bold;
}

.total-column {
    font-weight: bold;
    background: #f1f1f1;
}

.out-text {
    color: #d32f2f;
    font-weight: bold;
}

/* WINNER */

.winner {
    display: none;
    text-align: center;
    background: linear-gradient(135deg, #ffd700, #ff9800);
    color: #222;
    border-radius: 18px;
    padding: 30px 15px;
    margin-bottom: 20px;
}

.winner h2 {
    font-size: 32px;
}

.winner-name {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
}

/* MESSAGE */

.message {
    display: none;
    background: rgba(255,255,255,0.12);
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 30px;
    opacity: 0.8;
}

/* BOTTOM BUTTONS */

.bottom-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 25px 0;
}

.bottom-buttons button {
    min-width: 150px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 26px;
    }

    .panel {
        padding: 15px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .bottom-buttons {
        flex-direction: column;
    }

    .bottom-buttons button {
        width: 100%;
    }

    .winner-name {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🃏 Rummy Score Tracker</h1>


<!-- ==============================
     SETUP
================================ -->

<div class="panel">

    <h2>Game Setup</h2>

    <div class="setup-grid">

        <div>
            <label>Maximum Players</label>

            <input
                type="number"
                id="maxPlayers"
                value="6"
                min="2"
                max="50">
        </div>


        <div>
            <label>Elimination Limit</label>

            <input
                type="number"
                id="scoreLimit"
                value="101"
                min="1">
        </div>


        <div>
            <label>Player Name</label>

            <input
                type="text"
                id="playerName"
                placeholder="Enter player name">
        </div>


        <div style="display:flex;align-items:end;">

            <button
                type="button"
                class="add-btn"
                id="addPlayerBtn"
                style="width:100%;">
                + Add Player
            </button>

        </div>

    </div>


    <button
        type="button"
        class="start-btn"
        id="startGameBtn"
        style="width:100%;margin-top:15px;">

        ▶ START GAME

    </button>


    <div
        class="message"
        id="setupMessage">
    </div>

</div>


<!-- ==============================
     GAME INFORMATION
================================ -->

<div class="info-grid">

    <div class="info-box">
        <small>Total Players</small>
        <strong id="totalPlayers">0</strong>
    </div>

    <div class="info-box">
        <small>Players Remaining</small>
        <strong id="remainingPlayers">0</strong>
    </div>

    <div class="info-box">
        <small>Current Round</small>
        <strong id="currentRoundNumber">0</strong>
    </div>

</div>


<!-- ==============================
     WINNER
================================ -->

<div
    class="winner"
    id="winnerBox">

    <h2>🏆 WINNER 🏆</h2>

    <div
        class="winner-name"
        id="winnerName">
    </div>

    <p>
        Congratulations! Last player remaining.
    </p>

</div>


<!-- ==============================
     SCORE ENTRY
================================ -->

<div
    class="panel score-section"
    id="scoreSection">

    <div class="round-title">
        📝 Round <span id="roundDisplay">1</span>
    </div>

    <div class="round-subtitle">
        Enter the score received by each player in this round.
    </div>


    <div
        class="score-grid"
        id="scoreGrid">
    </div>


    <button
        type="button"
        class="submit-btn"
        id="submitRoundBtn">

        ✓ SUBMIT ROUND

    </button>


    <div
        class="message"
        id="roundMessage">
    </div>

</div>


<!-- ==============================
     PLAYERS
================================ -->

<div class="panel">

    <h2>👥 Players</h2>

    <div
        class="players"
        id="playersContainer">

        <div class="empty">
            Add players and press START GAME.
        </div>

    </div>

</div>


<!-- ==============================
     SCORE TABLE
================================ -->

<div class="panel">

    <h2>📊 Round-by-Round Scores</h2>

    <div class="table-wrapper">

        <table>

            <thead id="scoreTableHead">

                <tr>
                    <th>Player</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="scoreTableBody">
            </tbody>

        </table>

    </div>

</div>


<!-- ==============================
     BUTTONS
================================ -->

<div class="bottom-buttons">

    <button
        type="button"
        class="undo-btn"
        id="undoBtn">

        ↩ Undo Last Round

    </button>


    <button
        type="button"
        class="new-btn"
        id="newGameBtn">

        🔄 New Game

    </button>

</div>

</div>


<script>

/*
====================================================
RUMMY SCORE TRACKER
====================================================
*/


let players = [];
let rounds = [];
let gameStarted = false;
let gameOver = false;


/* ==============================
   GET ELEMENTS
================================ */

const maxPlayers =
    document.getElementById("maxPlayers");

const scoreLimit =
    document.getElementById("scoreLimit");

const playerName =
    document.getElementById("playerName");

const playersContainer =
    document.getElementById("playersContainer");

const scoreSection =
    document.getElementById("scoreSection");

const scoreGrid =
    document.getElementById("scoreGrid");

const winnerBox =
    document.getElementById("winnerBox");

const winnerName =
    document.getElementById("winnerName");

const roundMessage =
    document.getElementById("roundMessage");

const setupMessage =
    document.getElementById("setupMessage");


/* ==============================
   ADD PLAYER
================================ */

document
.getElementById("addPlayerBtn")
.addEventListener("click", addPlayer);


playerName.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            addPlayer();
        }

    }
);


function addPlayer() {

    if (gameStarted) {

        showSetupMessage(
            "The game has already started. Start a new game to change the players."
        );

        return;
    }


    const name =
        playerName.value.trim();


    const max =
        Number(maxPlayers.value);


    if (!name) {

        showSetupMessage(
            "Please enter a player name."
        );

        return;
    }


    if (
        !Number.isInteger(max) ||
        max < 2 ||
        max > 50
    ) {

        showSetupMessage(
            "Maximum players must be between 2 and 50."
        );

        return;
    }


    if (players.length >= max) {

        showSetupMessage(
            "Maximum player limit reached."
        );

        return;
    }


    players.push({

        id:
            Date.now().toString() +
            Math.random().toString(16),

        name: name,

        total: 0,

        eliminated: false

    });


    playerName.value = "";

    showSetupMessage(
        name + " added successfully."
    );


    renderAll();
}


/* ==============================
   START GAME
================================ */

document
.getElementById("startGameBtn")
.addEventListener("click", startGame);


function startGame() {

    if (gameStarted) {

        showSetupMessage(
            "Game is already running."
        );

        return;
    }


    if (players.length < 2) {

        showSetupMessage(
            "Add at least 2 players before starting."
        );

        return;
    }


    const limit =
        Number(scoreLimit.value);


    if (
        !Number.isInteger(limit) ||
        limit < 1
    ) {

        showSetupMessage(
            "Please enter a valid elimination limit."
        );

        return;
    }


    gameStarted = true;

    gameOver = false;


    maxPlayers.disabled = true;
    scoreLimit.disabled = true;
    playerName.disabled = true;

    document.getElementById(
        "addPlayerBtn"
    ).disabled = true;

    document.getElementById(
        "startGameBtn"
    ).disabled = true;


    prepareRound();

    renderAll();

}


/* ==============================
   PREPARE ROUND
================================ */

function prepareRound() {

    if (!gameStarted || gameOver) {
        return;
    }


    const activePlayers =
        players.filter(
            player => !player.eliminated
        );


    if (activePlayers.length <= 1) {

        checkWinner();

        return;
    }


    const roundNumber =
        rounds.length + 1;


    document.getElementById(
        "roundDisplay"
    ).textContent = roundNumber;


    scoreGrid.innerHTML = "";


    activePlayers.forEach(
        player => {

            const box =
                document.createElement("div");

            box.className =
                "score-box";


            const label =
                document.createElement("label");

            label.textContent =
                player.name;


            const input =
                document.createElement("input");

            input.type = "number";

            input.min = "0";

            input.step = "1";

            input.value = "0";

            input.dataset.playerId =
                player.id;


            box.appendChild(label);

            box.appendChild(input);

            scoreGrid.appendChild(box);

        }
    );


    scoreSection.style.display =
        "block";

}


/* ==============================
   SUBMIT ROUND
================================ */

document
.getElementById("submitRoundBtn")
.addEventListener(
    "click",
    submitRound
);


function submitRound() {

    if (!gameStarted || gameOver) {
        return;
    }


    const limit =
        Number(scoreLimit.value);


    if (
        !Number.isInteger(limit) ||
        limit < 1
    ) {

        showRoundMessage(
            "Invalid elimination limit."
        );

        return;
    }


    const inputs =
        scoreGrid.querySelectorAll(
            "input[data-player-id]"
        );


    const roundScores = {};

    let invalid = false;


    inputs.forEach(
        input => {

            let value =
                Number(input.value);


            if (
                !Number.isFinite(value) ||
                value < 0
            ) {

                invalid = true;

                return;
            }


            /*
            Rummy scores are whole numbers.
            */

            value =
                Math.floor(value);


            roundScores[
                input.dataset.playerId
            ] = value;

        }
    );


    if (invalid) {

        showRoundMessage(
            "Please enter valid scores for all players."
        );

        return;
    }


    /*
    SAVE ROUND
    */

    rounds.push({

        number:
            rounds.length + 1,

        scores:
            roundScores

    });


    /*
    ADD SCORES TO TOTAL
    */

    players.forEach(
        player => {

            if (player.eliminated) {
                return;
            }


            const score =
                roundScores[player.id];


            if (
                Number.isFinite(score)
            ) {

                player.total += score;

            }

        }
    );


    /*
    ELIMINATE PLAYERS
    */

    const eliminatedPlayers = [];


    players.forEach(
        player => {

            if (
                !player.eliminated &&
                player.total >= limit
            ) {

                player.eliminated = true;

                eliminatedPlayers.push(
                    player.name
                );

            }

        }
    );


    /*
    HIDE CURRENT SCORE ENTRY
    */

    scoreSection.style.display =
        "none";


    /*
    SHOW ROUND RESULT
    */

    if (eliminatedPlayers.length > 0) {

        showRoundMessage(
            "❌ Eliminated: " +
            eliminatedPlayers.join(", ")
        );

    } else {

        showRoundMessage(
            "✅ Round " +
            rounds.length +
            " saved successfully."
        );

    }


    renderAll();


    /*
    CHECK WHETHER GAME IS OVER
    */

    checkWinner();


    /*
    IF GAME CONTINUES,
    PREPARE NEXT ROUND
    */

    if (!gameOver) {

        setTimeout(
            function() {

                prepareRound();

                renderAll();

            },
            300
        );

    }

}


/* ==============================
   CHECK WINNER
================================ */

function checkWinner() {

    const activePlayers =
        players.filter(
            player => !player.eliminated
        );


    if (
        players.length >= 2 &&
        activePlayers.length === 1
    ) {

        gameOver = true;


        const winner =
            activePlayers[0];


        winnerBox.style.display =
            "block";


        winnerName.textContent =
            "🎉 " + winner.name;


        scoreSection.style.display =
            "none";


        document.getElementById(
            "submitRoundBtn"
        ).disabled = true;


        winnerBox.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


/* ==============================
   EDIT NAME
================================ */

function editPlayer(id) {

    const player =
        players.find(
            p => p.id === id
        );


    if (!player) {
        return;
    }


    const newName =
        prompt(
            "Enter new name:",
            player.name
        );


    if (
        newName &&
        newName.trim()
    ) {

        player.name =
            newName.trim();

        renderAll();

        /*
        If game is active,
        rebuild current score fields
        so the new name appears.
        */

        if (
            gameStarted &&
            !gameOver
        ) {

            prepareRound();

        }

    }

}


/* ==============================
   UNDO LAST ROUND
================================ */

document
.getElementById("undoBtn")
.addEventListener(
    "click",
    undoLastRound
);


function undoLastRound() {

    if (!gameStarted) {

        alert(
            "Start the game first."
        );

        return;
    }


    if (rounds.length === 0) {

        alert(
            "There is no round to undo."
        );

        return;
    }


    if (
        !confirm(
            "Undo the last round?"
        )
    ) {

        return;
    }


    const lastRound =
        rounds.pop();


    /*
    Recalculate EVERYTHING
    from the remaining rounds.
    */

    players.forEach(
        player => {

            player.total = 0;

            player.eliminated = false;

        }
    );


    const limit =
        Number(scoreLimit.value);


    rounds.forEach(
        round => {

            players.forEach(
                player => {

                    const score =
                        round.scores[player.id];


                    if (
                        Number.isFinite(score)
                    ) {

                        player.total += score;

                    }

                }
            );


            players.forEach(
                player => {

                    if (
                        !player.eliminated &&
                        player.total >= limit
                    ) {

                        player.eliminated = true;

                    }

                }
            );

        }
    );


    gameOver = false;


    winnerBox.style.display =
        "none";


    document.getElementById(
        "submitRoundBt
