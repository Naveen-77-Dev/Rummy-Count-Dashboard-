<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rummy Score Tracker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #141e30, #243b55);
    min-height: 100vh;
    color: white;
    padding: 15px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 15px 0 25px;
    font-size: 32px;
}

.panel {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.add-btn {
    background: #00c853;
    color: white;
}

.round-btn {
    background: #1976d2;
    color: white;
}

.reset-btn {
    background: #e53935;
    color: white;
}

.edit-btn {
    background: #ff9800;
    color: white;
}

.remove-btn {
    background: #d32f2f;
    color: white;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.info-box {
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.info-box small {
    display: block;
    opacity: 0.8;
}

.info-box strong {
    display: block;
    font-size: 28px;
    margin-top: 5px;
}

/* Winner */

.winner {
    display: none;
    background: linear-gradient(135deg, #ffd700, #ff9800);
    color: #222;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 20px;
}

.winner h2 {
    font-size: 32px;
}

.winner-name {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
}

/* Players */

.players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.player-card {
    background: white;
    color: #222;
    border-radius: 14px;
    padding: 18px;
}

.player-card.out {
    background: #e0e0e0;
    opacity: 0.6;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.player-name {
    font-size: 21px;
    font-weight: bold;
    word-break: break-word;
}

.total {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    margin: 15px 0;
    color: #1565c0;
}

.status {
    text-align: center;
    font-weight: bold;
    margin-bottom: 12px;
}

.status.playing {
    color: #00a152;
}

.status.out {
    color: #d32f2f;
}

.player-actions {
    display: flex;
    gap: 7px;
}

.player-actions button {
    flex: 1;
}

/* Round Table */

.table-section {
    margin-top: 25px;
}

.table-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    color: #222;
    min-width: 600px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #263238;
    color: white;
}

td.name {
    font-weight: bold;
    text-align: left;
}

.out-cell {
    color: #d32f2f;
    font-weight: bold;
}

.total-cell {
    font-weight: bold;
    background: #f5f5f5;
}

/* Score Entry */

.score-entry {
    display: none;
}

.score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.score-input-box {
    background: rgba(255,255,255,0.08);
    padding: 12px;
    border-radius: 10px;
}

.score-input-box span {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.score-input-box input {
    background: white;
}

.message {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    display: none;
}

.empty {
    text-align: center;
    padding: 30px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 26px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    .winner-name {
        font-size: 32px;
    }

    .player-actions {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🃏 Rummy Score Tracker</h1>


<!-- GAME SETUP -->

<div class="panel">

    <div class="setup-grid">

        <div>
            <label>Maximum Players</label>
            <input
                type="number"
                id="maxPlayers"
                value="6"
                min="2"
                max="50">
        </div>

        <div>
            <label>Elimination Limit</label>
            <input
                type="number"
                id="limit"
                value="101"
                min="1">
        </div>

        <div>
            <label>Player Name</label>
            <input
                type="text"
                id="playerName"
                placeholder="Enter player name">
        </div>

        <div style="display:flex;align-items:end;">
            <button
                class="add-btn"
                style="width:100%;"
                id="addPlayerBtn">
                + Add Player
            </button>
        </div>

    </div>

</div>


<!-- GAME INFORMATION -->

<div class="info">

    <div class="info-box">
        <small>Total Players</small>
        <strong id="playerCount">0</strong>
    </div>

    <div class="info-box">
        <small>Players Remaining</small>
        <strong id="remainingCount">0</strong>
    </div>

    <div class="info-box">
        <small>Round</small>
        <strong id="roundNumber">0</strong>
    </div>

</div>


<!-- WINNER -->

<div class="winner" id="winnerBox">

    <h2>🏆 WINNER 🏆</h2>

    <div class="winner-name" id="winnerName"></div>

    <p>Last player remaining!</p>

</div>


<!-- SCORE ENTRY -->

<div class="panel score-entry" id="scoreEntry">

    <h2>Enter Round <span id="currentRound"></span> Scores</h2>

    <p style="margin-top:8px;opacity:0.8;">
        Enter the score each player received in this round.
    </p>

    <div class="score-grid" id="scoreGrid"></div>

    <button
        class="round-btn"
        id="submitRoundBtn"
        style="margin-top:15px;">
        ✓ Submit Round
    </button>

    <div class="message" id="message"></div>

</div>


<!-- PLAYERS -->

<div class="panel">

    <h2 style="margin-bottom:15px;">Players</h2>

    <div class="players" id="playersContainer">

        <div class="empty">
            Add players to begin the game.
        </div>

    </div>

</div>


<!-- ROUND TABLE -->

<div class="panel table-section">

    <h2 style="margin-bottom:15px;">
        📊 Round-by-Round Scores
    </h2>

    <div class="table-wrapper">

        <table>

            <thead id="tableHead">
                <tr>
                    <th>Player</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="tableBody">
            </tbody>

        </table>

    </div>

</div>


<!-- RESET -->

<div style="text-align:center;margin:25px 0;">

    <button
        class="reset-btn"
        id="resetBtn">
        🔄 New Game
    </button>

</div>

</div>


<script>

let players = [];
let rounds = [];
let gameOver = false;


/* ==========================
   ELEMENTS
========================== */

const maxPlayersInput =
    document.getElementById("maxPlayers");

const limitInput =
    document.getElementById("limit");

const playerNameInput =
    document.getElementById("playerName");

const playersContainer =
    document.getElementById("playersContainer");

const scoreEntry =
    document.getElementById("scoreEntry");

const scoreGrid =
    document.getElementById("scoreGrid");

const message =
    document.getElementById("message");


/* ==========================
   ADD PLAYER
========================== */

document
.getElementById("addPlayerBtn")
.addEventListener("click", addPlayer);


playerNameInput
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        addPlayer();
    }

});


function addPlayer() {

    if (gameOver) {
        alert("Game is already finished. Start a new game.");
        return;
    }

    const name =
        playerNameInput.value.trim();

    const maxPlayers =
        parseInt(maxPlayersInput.value);

    if (!name) {
        alert("Please enter a player name.");
        return;
    }

    if (
        !Number.isFinite(maxPlayers) ||
        maxPlayers < 2
    ) {
        alert("Please enter a valid player limit.");
        return;
    }

    if (players.length >= maxPlayers) {
        alert("Maximum player limit reached.");
        return;
    }

    players.push({

        id: Date.now() + Math.random(),

        name: name,

        total: 0,

        eliminated: false

    });

    playerNameInput.value = "";

    render();

}


/* ==========================
   EDIT PLAYER
========================== */

function editPlayer(id) {

    const player =
        players.find(p => p.id === id);

    if (!player) return;

    const newName =
        prompt(
            "Enter new player name:",
            player.name
        );

    if (
        newName &&
        newName.trim()
    ) {

        player.name =
            newName.trim();

        render();

    }

}


/* ==========================
   REMOVE PLAYER
========================== */

function removePlayer(id) {

    if (rounds.length > 0) {

        alert(
            "Players cannot be removed after scoring has started."
        );

        return;
    }

    const player =
        players.find(p => p.id === id);

    if (!player) return;

    if (
        confirm(
            "Remove " + player.name + "?"
        )
    ) {

        players =
            players.filter(
                p => p.id !== id
            );

        render();

    }

}


/* ==========================
   START ROUND
========================== */

function prepareRound() {

    if (gameOver) return;

    if (players.length < 2) {

        alert(
            "Add at least 2 players."
        );

        return;

    }

    const activePlayers =
        players.filter(
            p => !p.eliminated
        );

    if (activePlayers.length <= 1) {

        checkWinner();

        return;

    }

    const round =
        rounds.length + 1;

    document.getElementById(
        "currentRound"
    ).textContent = round;

    scoreGrid.innerHTML = "";

    activePlayers.forEach(player => {

        const box =
            document.createElement("div");

        box.className =
            "score-input-box";

        box.innerHTML = `

            <span>
                ${escapeHTML(player.name)}
            </span>

            <input
                type="number"
                min="0"
                step="1"
                value="0"
                data-player-id="${player.id}"
                placeholder="Score">

        `;

        scoreGrid.appendChild(box);

    });

    scoreEntry.style.display = "block";

    scoreEntry.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/* ==========================
   SUBMIT ROUND
========================== */

document
.getElementById("submitRoundBtn")
.addEventListener("click", submitRound);


function submitRound() {

    if (gameOver) return;

    const limit =
        parseInt(limitInput.value);

    if (
        !Number.isFinite(limit) ||
        limit < 1
    ) {

        alert(
            "Please enter a valid elimination limit."
        );

        return;

    }


    const inputs =
        scoreGrid.querySelectorAll(
            "input[data-player-id]"
        );


    const roundScores = {};

    let valid = true;


    inputs.forEach(input => {

        const value =
            Number(input.value);

        if (
            !Number.isFinite(value) ||
            value < 0
        ) {

            valid = false;

        }

        roundScores[
            input.dataset.playerId
        ] = value;

    });


    if (!valid) {

        alert(
            "Please enter valid scores."
        );

        return;

    }


    /* Add scores to totals */

    players.forEach(player => {

        if (player.eliminated) {
            return;
        }

        const score =
            roundScores[player.id];

        player.total += score;

    });


    /* Save round */

    rounds.push({
        number: rounds.length + 1,
        scores: roundScores
    });


    /* Eliminate players */

    let eliminatedThisRound = [];


    players.forEach(player => {

        if (
            !player.eliminated &&
            player.total >= limit
        ) {

            player.eliminated = true;

            eliminatedThisRound.push(
                player.name
            );

        }

    });


    scoreEntry.style.display = "none";


    if (eliminatedThisRound.length > 0) {

        showMessage(
            "❌ Eliminated this round: " +
            eliminatedThisRound.join(", ")
        );

    } else {

        showMessage(
            "Round " +
            rounds.length +
            " recorded successfully."
        );

    }


    render();

    checkWinner();

}


/* ==========================
   CHECK WINNER
========================== */

function checkWinner() {

    const activePlayers =
        players.filter(
            p => !p.eliminated
        );


    if (
        players.length >= 2 &&
        activePlayers.length === 1
    ) {

        gameOver = true;

        const winner =
            activePlayers[0];

        document.getElementById(
            "winnerBox"
        ).style.display = "block";

        document.getElementById(
            "winnerName"
        ).textContent =
            "🎉 " + winner.name;

        scoreEntry.style.display =
            "none";

        document.getElementById(
            "winnerBox"
        ).scrollIntoView({
            behavior: "smooth"
        });

    }

}


/* ==========================
   RENDER EVERYTHING
========================== */

function render() {

    renderPlayers();

    renderTable();

    updateInfo();

}


/* ==========================
   RENDER PLAYERS
========================== */

function renderPlayers() {

    if (players.length === 0) {

        playersContainer.innerHTML = `
            <div class="empty">
                Add players to begin the game.
            </div>
        `;

        return;

    }


    playersContainer.innerHTML = "";


    players.forEach(player => {

        const card =
            document.createElement("div");

        card.className =
            "player-card " +
            (player.eliminated
                ? "out"
                : "");


        card.innerHTML = `

            <div class="player-header">

                <div class="player-name">
                    ${escapeHTML(player.name)}
                </div>

            </div>

            <div class="total">
                ${player.total}
            </div>

            <div class="status ${
                player.eliminated
                    ? "out"
                    : "playing"
            }">

                ${
                    player.eliminated
                        ? "❌ OUT"
                        : "🟢 PLAYING"
                }

            </div>

            <div class="player-actions">

                <button
                    class="edit-btn"
                    data-action="edit">
                    ✏️ Edit
                </button>

                ${
                    rounds.length === 0
                    ?
                    `
                    <button
                        class="remove-btn"
                        data-action="remove">
                        🗑 Remove
                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;


        card
        .querySelector(
            '[data-action="edit"]'
        )
        .addEventListener(
            "click",
            () => editPlayer(player.id)
        );


        const removeButton =
            card.querySelector(
                '[data-action="remove"]'
            );


        if (removeButton) {

            removeButton.addEventListener(
                "click",
                () => removePlayer(player.id)
            );

        }


        playersContainer.appendChild(card);

    });

}


/* ==========================
   ROUND TABLE
========================== */

function renderTable() {

    const head =
        document.getElementById(
            "tableHead"
        );

    const body =
        document.getElementById(
            "tableBody"
        );


    if (players.length === 0) {

        head.innerHTML = `
            <tr>
                <th>Player</th>
                <th>Total</th>
            </tr>
        `;

        body.innerHTML = "";

        return;

    }


    /* Header */

    let headerHTML =
        "<tr><th>Player</th>";


    rounds.forEach(round => {

        headerHTML +=
            `<th>Round ${round.number}</th>`;

    });


    headerHTML +=
        "<th>Total</th><th>Status</th></tr>";


    head.innerHTML =
        headerHTML;


    /* Rows */

    let bodyHTML = "";


    players.forEach(player => {

        bodyHTML += `
            <tr>

                <td class="name">
                    ${escapeHTML(player.name)}
                </td>
        `;


        rounds.forEach(round => {

            const score =
                round.scores[player.id];


            if (
                score === undefined
            ) {

                bodyHTML +=
                    "<td>—</td>";

            } else {

                bodyHTML +=
                    `<td>${score}</td>`;

            }

        });


        bodyHTML += `

                <td class="total-cell">
                    ${player.total}
                </td>

                <td class="${
                    player.eliminated
                        ? "out-cell"
                        : ""
                }">

                    ${
                        player.eliminated
                            ? "OUT"
                            : "Playing"
                    }

                </td>

            </tr>
        `;

    });


    body.innerHTML =
        bodyHTML;

}


/* ==========================
   UPDATE INFORMATION
========================== */

function updateInfo() {

    document.getElementById(
        "playerCount"
    ).textContent =
        players.length;


    document.getElementById(
        "remainingCount"
    ).textContent =
        players.filter(
            p => !p.eliminated
        ).length;


    document.getElementById(
        "roundNumber"
    ).textContent =
        rounds.length;

}


/* ==========================
   MESSAGE
========================== */

function showMessage(text) {

    message.textContent = text;

    message.style.display =
        "block";

    setTimeout(() => {

        message.style.display =
            "none";

    }, 4000);

}


/* ==========================
   RESET GAME
========================== */

document
.getElementById("resetBtn")
.addEventListener("click", resetGame);


function resetGame() {

    if (
        !confirm(
            "Start a new game? All scores will be deleted."
        )
    ) {

        return;

    }


    players = [];

    rounds = [];

    gameOver = false;


    document.getElementById(
        "winnerBox"
    ).style.display = "none";


    scoreEntry.style.display =
