<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rummy Score Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 10px 0 25px;
    font-size: 32px;
}

h2 {
    margin-top: 0;
}

.panel {
    background: rgba(255,255,255,0.10);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

/* SETUP */

.setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    min-height: 45px;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.add-btn {
    background: #00c853;
    color: white;
}

.start-btn {
    background: #1976d2;
    color: white;
}

.submit-btn {
    background: #00c853;
    color: white;
    width: 100%;
    margin-top: 15px;
    font-size: 17px;
}

.undo-btn {
    background: #ff9800;
    color: white;
}

.new-btn {
    background: #e53935;
    color: white;
}

/* INFO */

.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.info-box {
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.info-box small {
    display: block;
    opacity: 0.8;
}

.info-box strong {
    display: block;
    font-size: 28px;
    margin-top: 5px;
}

/* PLAYERS */

.players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.player-card {
    background: white;
    color: #222;
    border-radius: 14px;
    padding: 18px;
}

.player-card.out {
    background: #ddd;
    opacity: 0.65;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.player-name {
    font-size: 20px;
    font-weight: bold;
    word-break: break-word;
}

.edit-btn {
    background: #ff9800;
    color: white;
    min-height: 38px;
    padding: 8px 10px;
}

.total-score {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: #1565c0;
    margin: 15px 0;
}

.status {
    text-align: center;
    font-weight: bold;
}

.playing {
    color: #00a152;
}

.out-status {
    color: #d32f2f;
}

/* SCORE ENTRY */

.score-section {
    display: none;
}

.round-title {
    font-size: 25px;
    font-weight: bold;
}

.round-subtitle {
    margin-top: 5px;
    margin-bottom: 15px;
    opacity: 0.8;
}

.score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.score-box {
    background: rgba(255,255,255,0.10);
    padding: 13px;
    border-radius: 10px;
}

.score-box label {
    color: white;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    color: #222;
    min-width: 600px;
}

th,
td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

th {
    background: #263238;
    color: white;
}

td.player-column {
    text-align: left;
    font-weight: bold;
}

.total-column {
    font-weight: bold;
    background: #f1f1f1;
}

.out-text {
    color: #d32f2f;
    font-weight: bold;
}

/* WINNER */

.winner {
    display: none;
    text-align: center;
    background: linear-gradient(135deg, #ffd700, #ff9800);
    color: #222;
    border-radius: 18px;
    padding: 30px 15px;
    margin-bottom: 20px;
}

.winner h2 {
    font-size: 32px;
}

.winner-name {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
}

/* MESSAGE */

.message {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
}

/* BOTTOM */

.bottom-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.bottom-buttons button {
    min-width: 160px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 26px;
    }

    .panel {
        padding: 15px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .bottom-buttons {
        flex-direction: column;
    }

    .bottom-buttons button {
        width: 100%;
    }

    .winner-name {
        font-size: 32px;
    }
}
</style>
</head>


<body>

<div class="container">

    <h1>🃏 Rummy Score Tracker</h1>


    <!-- GAME SETUP -->

    <div class="panel">

        <h2>Game Setup</h2>

        <div class="setup-grid">

            <div>
                <label>Maximum Players</label>

                <input
                    type="number"
                    id="maxPlayers"
                    value="6"
                    min="2"
                    max="50">
            </div>


            <div>
                <label>Elimination Limit</label>

                <input
                    type="number"
                    id="scoreLimit"
                    value="101"
                    min="1">
            </div>


            <div>
                <label>Player Name</label>

                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter player name">
            </div>


            <div style="display:flex;align-items:end;">

                <button
                    type="button"
                    id="addPlayerBtn"
                    class="add-btn"
                    style="width:100%;">

                    + ADD PLAYER

                </button>

            </div>

        </div>


        <button
            type="button"
            id="startGameBtn"
            class="start-btn"
            style="width:100%;margin-top:15px;">

            ▶ START GAME

        </button>


        <div
            id="setupMessage"
            class="message">
        </div>

    </div>


    <!-- INFORMATION -->

    <div class="info-grid">

        <div class="info-box">
            <small>Total Players</small>
            <strong id="totalPlayers">0</strong>
        </div>

        <div class="info-box">
            <small>Players Remaining</small>
            <strong id="remainingPlayers">0</strong>
        </div>

        <div class="info-box">
            <small>Rounds Played</small>
            <strong id="roundNumber">0</strong>
        </div>

    </div>


    <!-- WINNER -->

    <div
        id="winnerBox"
        class="winner">

        <h2>🏆 WINNER 🏆</h2>

        <div
            id="winnerName"
            class="winner-name">
        </div>

        <p>Last player remaining!</p>

    </div>


    <!-- SCORE ENTRY -->

    <div
        id="scoreSection"
        class="panel score-section">

        <div class="round-title">

            📝 Round
            <span id="roundDisplay">1</span>

        </div>

        <div class="round-subtitle">

            Enter the score received by each player
            in this round.

        </div>


        <div
            id="scoreGrid"
            class="score-grid">
        </div>


        <button
            type="button"
            id="submitRoundBtn"
            class="submit-btn">

            ✓ SUBMIT ROUND

        </button>


        <div
            id="roundMessage"
            class="message">
        </div>

    </div>


    <!-- PLAYERS -->

    <div class="panel">

        <h2>👥 Players</h2>

        <div
            id="playersContainer"
            class="players">

            <div class="empty">
                Add players above.
            </div>

        </div>

    </div>


    <!-- SCORE TABLE -->

    <div class="panel">

        <h2>📊 Round-by-Round Scores</h2>

        <div class="table-wrapper">

            <table>

                <thead id="scoreTableHead">

                    <tr>
                        <th>Player</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="scoreTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="bottom-buttons">

        <button
            type="button"
            id="undoBtn"
            class="undo-btn">

            ↩ UNDO LAST ROUND

        </button>


        <button
            type="button"
            id="newGameBtn"
            class="new-btn">

            🔄 NEW GAME

        </button>

    </div>

</div>


<script>

/* ==================================================
   RUMMY SCORE TRACKER
   ================================================== */

var players = [];
var rounds = [];
var gameStarted = false;
var gameOver = false;


/* ==================================================
   GET ELEMENTS
   ================================================== */

var maxPlayersInput =
    document.getElementById("maxPlayers");

var scoreLimitInput =
    document.getElementById("scoreLimit");

var playerNameInput =
    document.getElementById("playerName");

var addPlayerButton =
    document.getElementById("addPlayerBtn");

var startGameButton =
    document.getElementById("startGameBtn");

var submitRoundButton =
    document.getElementById("submitRoundBtn");

var undoButton =
    document.getElementById("undoBtn");

var newGameButton =
    document.getElementById("newGameBtn");

var playersContainer =
    document.getElementById("playersContainer");

var scoreSection =
    document.getElementById("scoreSection");

var scoreGrid =
    document.getElementById("scoreGrid");

var winnerBox =
    document.getElementById("winnerBox");

var winnerName =
    document.getElementById("winnerName");

var setupMessage =
    document.getElementById("setupMessage");

var roundMessage =
    document.getElementById("roundMessage");


/* ==================================================
   ADD PLAYER
   ================================================== */

addPlayerButton.addEventListener(
    "click",
    function () {

        addPlayer();

    }
);


playerNameInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            addPlayer();

        }

    }
);


function addPlayer() {

    if (gameStarted) {

        showSetupMessage(
            "Game already started. Press NEW GAME to start again."
        );

        return;
    }


    var name =
        playerNameInput.value.trim();


    var max =
        parseInt(maxPlayersInput.value, 10);


    if (name === "") {

        showSetupMessage(
            "Please enter a player name."
        );

        playerNameInput.focus();

        return;
    }


    if (
        isNaN(max) ||
        max < 2 ||
        max > 50
    ) {

        showSetupMessage(
            "Maximum players must be between 2 and 50."
        );

        return;
    }


    if (players.length >= max) {

        showSetupMessage(
            "You have reached the maximum number of players."
        );

        return;
    }


    /*
     Prevent duplicate names
    */

    for (
        var i = 0;
        i < players.length;
        i++
    ) {

        if (
            players[i].name.toLowerCase() ===
            name.toLowerCase()
        ) {

            showSetupMessage(
                "A player with this name already exists."
            );

            return;
        }

    }


    var player = {

        id:
            "player_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 100000),

        name: name,

        total: 0,

        eliminated: false

    };


    players.push(player);


    playerNameInput.value = "";


    showSetupMessage(
        name + " added successfully."
    );


    renderAll();

}


/* ==================================================
   START GAME
   ================================================== */

startGameButton.addEventListener(
    "click",
    function () {

        startGame();

    }
);


function startGame() {

    if (players.length < 2) {

        showSetupMessage(
            "Please add at least 2 players."
        );

        return;
    }


    var limit =
        parseInt(scoreLimitInput.value, 10);


    if (
        isNaN(limit) ||
        limit < 1
    ) {

        showSetupMessage(
            "Please enter a valid elimination limit."
        );

        return;
    }


    gameStarted = true;

    gameOver = false;


    /*
    Lock setup
    */

    maxPlayersInput.disabled = true;

    scoreLimitInput.disabled = true;

    playerNameInput.disabled = true;

    addPlayerButton.disabled = true;

    startGameButton.disabled = true;


    showSetupMessage(
        "Game started! Enter Round 1 scores below."
    );


    prepareRound();

    renderAll();

}


/* ==================================================
   PREPARE ROUND
   ================================================== */

function prepareRound() {

    if (!gameStarted || gameOver) {
        return;
    }


    var activePlayers =
        players.filter(
            function (player) {

                return !player.eliminated;

            }
        );


    if (activePlayers.length <= 1) {

        checkWinner();

        return;
    }


    var nextRound =
        rounds.length + 1;


    document.getElementById(
        "roundDisplay"
    ).textContent = nextRound;


    scoreGrid.innerHTML = "";


    /*
    Create score box for every active player
    */

    for (
        var i = 0;
        i < activePlayers.length;
        i++
    ) {

        var player =
            activePlayers[i];


        var box =
            document.createElement("div");

        box.className =
            "score-box";


        var label =
            document.createElement("label");

        label.textContent =
            player.name;


        var input =
            document.createElement("input");

        input.type = "number";

        input.min = "0";

        input.step = "1";

        input.value = "0";

        input.setAttribute(
            "data-player-id",
            player.id
        );


        box.appendChild(label);

        box.appendChild(input);

        scoreGrid.appendChild(box);

    }


    scoreSection.style.display =
        "block";


    /*
    Focus first score input
    */

    var firstInput =
        scoreGrid.querySelector("input");


    if (firstInput) {
        firstInput.focus();
    }

}


/* ==================================================
   SUBMIT ROUND
   ================================================== */

submitRoundButton.addEventListener(
    "click",
    function () {

        submitRound();

    }
);


function submitRound() {

    if (!gameStarted || gameOver) {
        return;
    }


    var limit =
        parseInt(scoreLimitInput.value, 10);


    if (
        isNaN(limit) ||
        limit < 1
    ) {

        showRoundMessage(
            "Invalid elimination limit."
        );

        return;
    }


    var inputs =
        scoreGrid.querySelectorAll(
            "input[data-player-id]"
        );


    var roundScores = {};

    var invalid = false;


    /*
    Read every score
    */

    for (
        var i = 0;
        i < inputs.length;
        i++
    ) {

        var input =
            inputs[i];


        var value =
            Number(input.value);


        if (
            !Number.isFinite(value) ||
            value < 0
        ) {

            invalid = true;

            break;
        }


        value =
            Math.floor(value);


        roundScores[
            input.getAttribute("data-player-id")
        ] = value;

    }


    if (invalid) {

        showRoundMessage(
            "Please enter a valid score for every player."
        );

        return;
    }


    /*
    Save round
    */

    rounds.push({

        number:
            rounds.length + 1,

        scores:
            roundScores

    });


    /*
    Add scores to player totals
    */

    for (
        var j = 0;
        j < players.length;
        j++
    ) {

        var player =
            players[j];


        if (player.eliminated) {
            continue;
        }


        var score =
            roundScores[player.id];


        if (
            typeof score === "number"
        ) {

            player.total += score;

        }

    }


    /*
    Eliminate players
    */

    var eliminatedNames = [];


    for (
        var k = 0;
        k < players.length;
        k++
    ) {

        var currentPlayer =
            players[k];


        if (
            !currentPlayer.eliminated &&
            currentPlayer.total >= limit
        ) {

            currentPlayer.eliminated = true;

            eliminatedNames.push(
                currentPlayer.name
            );

        }

    }


    /*
    Hide score section temporarily
    */

    scoreSection.style.display =
        "none";


    /*
    Show result
    */

    if (eliminatedNames.length > 0) {

        showRoundMessage(
            "❌ OUT: " +
            eliminatedNames.join(", ")
        );

    } else {

        showRoundMessage(
            "✅ Round " +
            rounds.length +
            " saved."
        );

    }


    renderAll();


    /*
    Check winner
    */

    checkWinner();


    /*
    Continue to next round
    */

    if (!gameOver) {

        prepareRound();

    }

}


/* ==================================================
   CHECK WINNER
   ================================================== */

function checkWinner() {

    var activePlayers =
        players.filter(
            function (player) {

                return !player.eliminated;

            }
        );


    if (
        players.length >= 2 &&
        activePlayers.length === 1
    ) {

        gameOver = true;


        winnerName.textContent =
            "🎉 " + activePlayers[0].name;


        winnerBox.style.display =
            "block";


        scoreSection.style.display =
            "none";


        submitRoundButton.disabled =
            true;


        winnerBox.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


/* ==================================================
   EDIT PLAYER
   ================================================== */

function editPlayer(id) {

    var player =
        players.find(
            function (p) {

                return p.id === id;

            }
        );


    if (!player) {
        return;
    }


    var newName =
        prompt(
            "Enter new name:",
            player.name
        );


    if (
        newName === null ||
        newName.trim() === ""
    ) {

        return;
    }


    newName =
        newName.trim();


    /*
    Check duplicate names
    */

    for (
        var i = 0;
        i < players.length;
        i++
    ) {

        if (
            players[i].id !== id &&
            players[i].name.toLowerCase() ===
            newName.toLowerCase()
        ) {

            alert(
                "Another player already has this name."
            );

            return;
        }

    }


    player.name =
        newName;


    renderAll();


    /*
    Recreate current round fields
    */

    if (
        gameStarted &&
        !gameOver
    ) {

        prepareRound();

    }

}


/* ==================================================
   UNDO LAST ROUND
   ===========
